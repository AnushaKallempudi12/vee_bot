name: Riya AI — validate source

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate frontend and backend source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check production frontend files
        run: |
          test -s index.html
          test -s app.js
          test -s styles.css
          grep -q 'app.js' index.html

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile backend Python files
        run: python -m compileall -q backend

      - name: Test PDF extraction and visa classification
        run: python -m unittest discover -s backend -p "test_*.py"
